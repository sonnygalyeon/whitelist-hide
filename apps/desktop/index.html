<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>whitelist-hide</title>
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">whitelist-hide</p>
          <h1>Защита соединения</h1>
        </div>
        <span id="version" class="version"></span>
      </header>

      <section class="hero card">
        <div class="status-orb" id="status-orb" aria-hidden="true"></div>
        <div class="hero-copy">
          <p id="state-caption" class="muted">Проверяем состояние…</p>
          <h2 id="state">Загрузка</h2>
          <p id="state-detail" class="muted">
            Приложение проверяет движок и сетевой backend.
          </p>
        </div>
        <button id="toggle" class="primary" type="button" disabled>
          Подождите…
        </button>
      </section>

      <section class="grid">
        <article class="card">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Профиль</p>
              <h3 id="profile-name">Standard</h3>
            </div>
            <span id="profile-state" class="pill">Проверка</span>
          </div>
          <p class="muted">
            Встроенный сбалансированный профиль. Ручная настройка файлов не требуется.
          </p>
          <dl class="facts">
            <div><dt>Платформа</dt><dd id="platform">—</dd></div>
            <div><dt>Runtime</dt><dd id="runtime-state">—</dd></div>
          </dl>
        </article>

        <article class="card">
          <div class="section-heading">
            <div>
              <p class="eyebrow">Состояние</p>
              <h3>Диагностика</h3>
            </div>
            <button id="refresh" class="ghost" type="button">Обновить</button>
          </div>
          <div id="diagnostics" class="diagnostics"></div>
        </article>
      </section>

      <section class="card">
        <div class="section-heading">
          <div>
            <p class="eyebrow">События</p>
            <h3>Журнал</h3>
          </div>
          <button id="health" class="ghost" type="button">Проверить</button>
        </div>
        <div id="activity" class="activity" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
