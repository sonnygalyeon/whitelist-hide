schema = 1
id = "balanced"
description = "Balanced built-in desktop profile for common HTTPS/HTTP/QUIC filtering."

[filters]
tcp_ports = [
  { start = 80, end = 80 },
  { start = 443, end = 443 },
  { start = 2053, end = 2053 },
  { start = 2083, end = 2083 },
  { start = 2087, end = 2087 },
  { start = 2096, end = 2096 },
  { start = 8443, end = 8443 },
]
udp_ports = [
  { start = 443, end = 443 },
  { start = 19294, end = 19344 },
  { start = 50000, end = 50100 },
]
domain_lists = ["lists/general.txt"]

[[desync]]
mode = "fake"
repeats = 6

[[desync]]
mode = "multi-split"
positions = [1, 2]
