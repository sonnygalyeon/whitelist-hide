schema = 2
id = "flowseal-split"
description = "Flowseal-inspired sequence overlap: explicit HTTP/TLS, QUIC and Discord/STUN rules."

[[rules]]
protocol = "http"
split_seqovl = 681
split_pattern = "payloads/tls-google.hex"
ports = [{ start = 80, end = 80 }]
domain_lists = ["lists/general.txt"]
desync = [{ mode = "multi-split", positions = [1] }]

[[rules]]
protocol = "tls"
split_seqovl = 681
split_pattern = "payloads/tls-google.hex"
ports = [{ start = 443, end = 443 }, { start = 2053, end = 2053 }, { start = 2083, end = 2083 }, { start = 2087, end = 2087 }, { start = 2096, end = 2096 }, { start = 8443, end = 8443 }]
domain_lists = ["lists/general.txt"]
desync = [{ mode = "multi-split", positions = [1] }]

[[rules]]
protocol = "quic"
fake_payload = "payloads/quic-google.hex"
ports = [{ start = 443, end = 443 }]
domain_lists = ["lists/general.txt"]
desync = [{ mode = "fake", repeats = 6 }]

[[rules]]
protocol = "discord-stun"
fake_payload = "payloads/discord.hex"
ports = [{ start = 19294, end = 19344 }, { start = 50000, end = 50100 }]
desync = [{ mode = "fake", repeats = 6 }]
