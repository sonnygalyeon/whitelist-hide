schema = 1
id = "balanced-default"
description = "Conservative built-in profile for common HTTPS/HTTP and QUIC endpoints."

[filters]
tcp_ports = [
  { start = 80, end = 80 },
  { start = 443, end = 443 },
  { start = 2053, end = 2053 },
  { start = 2083, end = 2083 },
  { start = 2087, end = 2087 },
  { start = 2096, end = 2096 },
  { start = 8443, end = 8443 },
]
udp_ports = [
  { start = 443, end = 443 },
]
domain_lists = ["lists/general.txt"]

[[desync]]
mode = "fake"
repeats = 6

[[desync]]
mode = "multi-split"
positions = [2]
