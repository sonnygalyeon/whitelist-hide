[package]
name = "whitelist-hide-desktop"
version = "0.1.0"
description = "Desktop shell for whitelist-hide"
edition = "2024"

[lib]
name = "whitelist_hide_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
whitelist-hide-core = { path = "../../../crates/core" }
whitelist-hide-runtime = { path = "../../../crates/runtime" }

[workspace]
