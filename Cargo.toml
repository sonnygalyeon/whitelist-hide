[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/runtime",
    "crates/service",
    "crates/controller",
    "crates/helper",
    "crates/platform-macos",
    "crates/platform-windows",
    "crates/platform-linux",
    "crates/cli",
]

[workspace.package]
version = "1.0.0-rc.2"
edition = "2024"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"
