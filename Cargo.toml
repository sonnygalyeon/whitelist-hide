[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/runtime",
    "crates/orchestrator",
    "crates/service",
    "crates/platform-macos",
    "crates/platform-windows",
    "crates/platform-linux",
    "crates/cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"

[workspace.lints.rust]
unsafe_code = "forbid"
