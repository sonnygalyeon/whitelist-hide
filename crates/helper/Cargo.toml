[package]
name = "whitelist-hide-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "whitelist-hide-helper"
path = "src/main.rs"

[dependencies]
fs2 = "0.4"
whitelist-hide-controller = { path = "../controller" }

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3.9", features = ["handleapi", "processenv", "winbase"] }

[lints.rust]
# Only windows_stdio::prevent_inheritance may call the narrowly scoped Win32 API.
unsafe_code = "deny"
