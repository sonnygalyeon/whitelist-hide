name: generate-lockfiles

on:
  push:
    branches:
      - feature/release-candidate-runtime
    paths:
      - ".github/workflows/generate-lockfiles.yml"

permissions:
  contents: write

jobs:
  lockfiles:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/release-candidate-runtime

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Generate Cargo lockfile
        run: cargo generate-lockfile

      - name: Generate desktop npm lockfile
        working-directory: apps/desktop
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfiles
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- Cargo.lock apps/desktop/package-lock.json)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock apps/desktop/package-lock.json
          git commit -m "build: pin release dependency lockfiles"
          git push origin HEAD:feature/release-candidate-runtime
