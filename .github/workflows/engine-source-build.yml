name: engine-source-build

on:
  workflow_dispatch:
  push:
    paths:
      - "third_party/upstream.lock.toml"
      - "scripts/upstream_lock.py"
      - "scripts/windivert_lock.py"
      - ".github/workflows/engine-source-build.yml"
  pull_request:
    paths:
      - "third_party/upstream.lock.toml"
      - "scripts/upstream_lock.py"
      - "scripts/windivert_lock.py"
      - ".github/workflows/engine-source-build.yml"

permissions:
  contents: read

jobs:
  macos-utunws:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned macOS upstream
        id: upstream
        shell: bash
        run: python3 scripts/upstream_lock.py macos --github-output "$GITHUB_OUTPUT"

      - name: Fetch exact upstream commit
        shell: bash
        env:
          REPOSITORY: ${{ steps.upstream.outputs.repository }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
          LICENSE_PATH: ${{ steps.upstream.outputs.license_path }}
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin "$REPOSITORY"
          git -C upstream fetch --depth 1 origin "$COMMIT"
          test "$(git -C upstream rev-parse FETCH_HEAD)" = "$COMMIT"
          git -C upstream checkout --detach "$COMMIT"
          test "$(git -C upstream rev-parse HEAD)" = "$COMMIT"
          test -f "upstream/$LICENSE_PATH"

      - name: Build utunws from source
        shell: bash
        env:
          COMMIT: ${{ steps.upstream.outputs.commit }}
          SUBDIR: ${{ steps.upstream.outputs.subdir }}
          ARTIFACT: ${{ steps.upstream.outputs.artifact }}
          BUILD_TARGET: ${{ steps.upstream.outputs.build_target }}
          LICENSE_NAME: ${{ steps.upstream.outputs.license }}
        run: |
          set -euo pipefail
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          make -C "upstream/$SUBDIR" "$BUILD_TARGET"
          test -x "upstream/$SUBDIR/$ARTIFACT"
          mkdir -p dist/macos
          cp "upstream/$SUBDIR/$ARTIFACT" "dist/macos/$ARTIFACT"
          shasum -a 256 "dist/macos/$ARTIFACT" | tee dist/macos/SHA256SUMS
          {
            echo "source_commit=$COMMIT"
            echo "license=$LICENSE_NAME"
            echo "builder=github-actions/macos-latest"
          } > dist/macos/PROVENANCE.txt
          file "dist/macos/$ARTIFACT"

      - name: Upload source-built macOS engine
        uses: actions/upload-artifact@v4
        with:
          name: source-built-macos-utunws
          path: dist/macos/
          if-no-files-found: error

  linux-nfqws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Linux upstream
        id: upstream
        shell: bash
        run: python3 scripts/upstream_lock.py linux --github-output "$GITHUB_OUTPUT"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential             zlib1g-dev             libnetfilter-queue-dev             libnfnetlink-dev             libmnl-dev \
            libcap-dev

      - name: Fetch exact upstream commit
        shell: bash
        env:
          REPOSITORY: ${{ steps.upstream.outputs.repository }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
          LICENSE_PATH: ${{ steps.upstream.outputs.license_path }}
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin "$REPOSITORY"
          git -C upstream fetch --depth 1 origin "$COMMIT"
          test "$(git -C upstream rev-parse FETCH_HEAD)" = "$COMMIT"
          git -C upstream checkout --detach "$COMMIT"
          test "$(git -C upstream rev-parse HEAD)" = "$COMMIT"
          test -f "upstream/$LICENSE_PATH"

      - name: Build nfqws from source
        shell: bash
        env:
          COMMIT: ${{ steps.upstream.outputs.commit }}
          SUBDIR: ${{ steps.upstream.outputs.subdir }}
          ARTIFACT: ${{ steps.upstream.outputs.artifact }}
          LICENSE_NAME: ${{ steps.upstream.outputs.license }}
        run: |
          set -euo pipefail
          make -C "upstream/$SUBDIR"
          test -x "upstream/$SUBDIR/$ARTIFACT"
          mkdir -p dist/linux
          cp "upstream/$SUBDIR/$ARTIFACT" "dist/linux/$ARTIFACT"
          sha256sum "dist/linux/$ARTIFACT" | tee dist/linux/SHA256SUMS
          {
            echo "source_commit=$COMMIT"
            echo "license=$LICENSE_NAME"
            echo "builder=github-actions/ubuntu-latest"
          } > dist/linux/PROVENANCE.txt
          file "dist/linux/$ARTIFACT"

      - name: Upload source-built Linux engine
        uses: actions/upload-artifact@v4
        with:
          name: source-built-linux-nfqws
          path: dist/linux/
          if-no-files-found: error


  windows-winws:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Windows upstream
        id: upstream
        shell: pwsh
        run: python scripts/upstream_lock.py windows --github-output "$env:GITHUB_OUTPUT"

      - name: Fetch exact upstream commit
        shell: pwsh
        env:
          REPOSITORY: ${{ steps.upstream.outputs.repository }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
          LICENSE_PATH: ${{ steps.upstream.outputs.license_path }}
        run: |
          git init upstream
          git -C upstream remote add origin $env:REPOSITORY
          git -C upstream fetch --depth 1 origin $env:COMMIT
          if ((git -C upstream rev-parse FETCH_HEAD).Trim() -ne $env:COMMIT) { throw "commit mismatch" }
          git -C upstream checkout --detach $env:COMMIT
          if ((git -C upstream rev-parse HEAD).Trim() -ne $env:COMMIT) { throw "checkout mismatch" }
          if (-not (Test-Path "upstream/$env:LICENSE_PATH")) { throw "license file missing" }

      - name: Set up Cygwin toolchain
        uses: cygwin/cygwin-install-action@v4
        with:
          platform: x86_64
          packages: >-
            gcc-core
            make
            zlib-devel

      - name: Build winws from source
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        env:
          COMMIT: ${{ steps.upstream.outputs.commit }}
          SUBDIR: ${{ steps.upstream.outputs.subdir }}
          ARTIFACT: ${{ steps.upstream.outputs.artifact }}
          BUILD_TARGET: ${{ steps.upstream.outputs.build_target }}
          LICENSE_NAME: ${{ steps.upstream.outputs.license }}
        run: >-
          export MAKEFLAGS=-j$(nproc) &&
          export CFLAGS="-DZAPRET_GH_VER=whitelist-hide -DZAPRET_GH_HASH=$COMMIT" &&
          cd upstream &&
          make -C "$SUBDIR" "$BUILD_TARGET" &&
          test -f "$SUBDIR/$ARTIFACT" &&
          mkdir -p ../dist/windows &&
          cp "$SUBDIR/$ARTIFACT" "../dist/windows/$ARTIFACT" &&
          sha256sum "../dist/windows/$ARTIFACT" > ../dist/windows/SHA256SUMS &&
          printf 'source_commit=%s\nlicense=%s\nbuilder=github-actions/windows-latest+cygwin\n' "$COMMIT" "$LICENSE_NAME" > ../dist/windows/PROVENANCE.txt

      - name: Read pinned WinDivert release
        id: windivert
        shell: pwsh
        run: python scripts/windivert_lock.py --github-output "$env:GITHUB_OUTPUT"

      - name: Verify and stage WinDivert
        shell: pwsh
        env:
          ASSET_URL: ${{ steps.windivert.outputs.asset_url }}
          EXPECTED_SHA256: ${{ steps.windivert.outputs.sha256 }}
          WINDIVERT_COMMIT: ${{ steps.windivert.outputs.commit }}
          WINDIVERT_VERSION: ${{ steps.windivert.outputs.version }}
          WINDIVERT_LICENSE: ${{ steps.windivert.outputs.license }}
        run: |
          Invoke-WebRequest -Uri $env:ASSET_URL -OutFile windivert.zip
          $actual = (Get-FileHash windivert.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:EXPECTED_SHA256) { throw "WinDivert SHA-256 mismatch" }
          Expand-Archive -Path windivert.zip -DestinationPath windivert -Force

          $dll = Get-ChildItem windivert -Recurse -Filter WinDivert.dll | Where-Object { $_.FullName -match '[\\/]x64[\\/]' }
          $sys = Get-ChildItem windivert -Recurse -Filter WinDivert64.sys | Where-Object { $_.FullName -match '[\\/]x64[\\/]' }
          if (@($dll).Count -ne 1 -or @($sys).Count -ne 1) { throw "unexpected WinDivert package layout" }

          Copy-Item $dll.FullName dist/windows/WinDivert.dll
          Copy-Item $sys.FullName dist/windows/WinDivert64.sys
          (Get-FileHash dist/windows/WinDivert.dll -Algorithm SHA256).Hash.ToLowerInvariant() + "  WinDivert.dll" | Add-Content -Encoding ascii dist/windows/SHA256SUMS
          (Get-FileHash dist/windows/WinDivert64.sys -Algorithm SHA256).Hash.ToLowerInvariant() + "  WinDivert64.sys" | Add-Content -Encoding ascii dist/windows/SHA256SUMS

          "windivert_version=$env:WINDIVERT_VERSION" | Add-Content -Encoding ascii dist/windows/PROVENANCE.txt
          "windivert_commit=$env:WINDIVERT_COMMIT" | Add-Content -Encoding ascii dist/windows/PROVENANCE.txt
          "windivert_release_sha256=$actual" | Add-Content -Encoding ascii dist/windows/PROVENANCE.txt
          "windivert_license=$env:WINDIVERT_LICENSE" | Add-Content -Encoding ascii dist/windows/PROVENANCE.txt

      - name: Record winws runtime dependencies
        shell: pwsh
        run: |
          & C:\cygwin\bin\cygcheck.exe (Resolve-Path dist/windows/winws.exe) | Out-File -Encoding ascii dist/windows/DEPENDENCIES.txt

      - name: Upload source-built Windows engine
        uses: actions/upload-artifact@v4
        with:
          name: source-built-windows-winws
          path: dist/windows/
          if-no-files-found: error
