name: engine-source-build

on:
  workflow_dispatch:
  push:
    paths:
      - "third_party/upstream.lock.toml"
      - "scripts/upstream_lock.py"
      - ".github/workflows/engine-source-build.yml"
  pull_request:
    paths:
      - "third_party/upstream.lock.toml"
      - "scripts/upstream_lock.py"
      - ".github/workflows/engine-source-build.yml"

permissions:
  contents: read

jobs:
  macos-utunws:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned macOS upstream
        id: upstream
        shell: bash
        run: python3 scripts/upstream_lock.py macos --github-output "$GITHUB_OUTPUT"

      - name: Fetch exact upstream commit
        shell: bash
        env:
          REPOSITORY: ${{ steps.upstream.outputs.repository }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
          LICENSE_PATH: ${{ steps.upstream.outputs.license_path }}
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin "$REPOSITORY"
          git -C upstream fetch --depth 1 origin "$COMMIT"
          test "$(git -C upstream rev-parse FETCH_HEAD)" = "$COMMIT"
          git -C upstream checkout --detach "$COMMIT"
          test "$(git -C upstream rev-parse HEAD)" = "$COMMIT"
          test -f "upstream/$LICENSE_PATH"

      - name: Build utunws from source
        shell: bash
        env:
          COMMIT: ${{ steps.upstream.outputs.commit }}
          SUBDIR: ${{ steps.upstream.outputs.subdir }}
          ARTIFACT: ${{ steps.upstream.outputs.artifact }}
          BUILD_TARGET: ${{ steps.upstream.outputs.build_target }}
          LICENSE_NAME: ${{ steps.upstream.outputs.license }}
        run: |
          set -euo pipefail
          export SDKROOT="$(xcrun --sdk macosx --show-sdk-path)"
          make -C "upstream/$SUBDIR" "$BUILD_TARGET"
          test -x "upstream/$SUBDIR/$ARTIFACT"
          mkdir -p dist/macos
          cp "upstream/$SUBDIR/$ARTIFACT" "dist/macos/$ARTIFACT"
          shasum -a 256 "dist/macos/$ARTIFACT" | tee dist/macos/SHA256SUMS
          {
            echo "source_commit=$COMMIT"
            echo "license=$LICENSE_NAME"
            echo "builder=github-actions/macos-latest"
          } > dist/macos/PROVENANCE.txt
          file "dist/macos/$ARTIFACT"

      - name: Upload source-built macOS engine
        uses: actions/upload-artifact@v4
        with:
          name: source-built-macos-utunws
          path: dist/macos/
          if-no-files-found: error

  linux-nfqws:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Linux upstream
        id: upstream
        shell: bash
        run: python3 scripts/upstream_lock.py linux --github-output "$GITHUB_OUTPUT"

      - name: Install build dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             build-essential             zlib1g-dev             libnetfilter-queue-dev             libnfnetlink-dev             libmnl-dev \
            libcap-dev

      - name: Fetch exact upstream commit
        shell: bash
        env:
          REPOSITORY: ${{ steps.upstream.outputs.repository }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
          LICENSE_PATH: ${{ steps.upstream.outputs.license_path }}
        run: |
          set -euo pipefail
          git init upstream
          git -C upstream remote add origin "$REPOSITORY"
          git -C upstream fetch --depth 1 origin "$COMMIT"
          test "$(git -C upstream rev-parse FETCH_HEAD)" = "$COMMIT"
          git -C upstream checkout --detach "$COMMIT"
          test "$(git -C upstream rev-parse HEAD)" = "$COMMIT"
          test -f "upstream/$LICENSE_PATH"

      - name: Build nfqws from source
        shell: bash
        env:
          COMMIT: ${{ steps.upstream.outputs.commit }}
          SUBDIR: ${{ steps.upstream.outputs.subdir }}
          ARTIFACT: ${{ steps.upstream.outputs.artifact }}
          LICENSE_NAME: ${{ steps.upstream.outputs.license }}
        run: |
          set -euo pipefail
          make -C "upstream/$SUBDIR"
          test -x "upstream/$SUBDIR/$ARTIFACT"
          mkdir -p dist/linux
          cp "upstream/$SUBDIR/$ARTIFACT" "dist/linux/$ARTIFACT"
          sha256sum "dist/linux/$ARTIFACT" | tee dist/linux/SHA256SUMS
          {
            echo "source_commit=$COMMIT"
            echo "license=$LICENSE_NAME"
            echo "builder=github-actions/ubuntu-latest"
          } > dist/linux/PROVENANCE.txt
          file "dist/linux/$ARTIFACT"

      - name: Upload source-built Linux engine
        uses: actions/upload-artifact@v4
        with:
          name: source-built-linux-nfqws
          path: dist/linux/
          if-no-files-found: error

  windows-winws2:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read pinned Windows upstream
        id: upstream
        shell: pwsh
        run: python scripts/upstream_lock.py windows --github-output "$env:GITHUB_OUTPUT"

      - name: Fetch exact upstream commit
        shell: pwsh
        env:
          REPOSITORY: ${{ steps.upstream.outputs.repository }}
          COMMIT: ${{ steps.upstream.outputs.commit }}
          LICENSE_PATH: ${{ steps.upstream.outputs.license_path }}
        run: |
          git init upstream
          git -C upstream remote add origin "$env:REPOSITORY"
          git -C upstream fetch --depth 1 origin "$env:COMMIT"
          if ((git -C upstream rev-parse FETCH_HEAD) -ne "$env:COMMIT") { throw "unexpected FETCH_HEAD" }
          git -C upstream checkout --detach "$env:COMMIT"
          if ((git -C upstream rev-parse HEAD) -ne "$env:COMMIT") { throw "unexpected HEAD" }
          if (-not (Test-Path "upstream/$env:LICENSE_PATH")) { throw "license file missing" }

      - name: Set up Cygwin
        uses: cygwin/cygwin-install-action@v4
        with:
          platform: x86_64
          site: http://ctm.crouchingtigerhiddenfruitbat.org/pub/cygwin/circa/64bit/2024/01/30/231215
          check-sig: 'false'
          packages: >-
            gcc-core
            make
            zlib-devel
            wget

      - name: Build static LuaJIT
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        run: |
          set -e
          LUAJIT_RELEASE=2.1-20250826
          wget -q "https://github.com/openresty/luajit2/archive/refs/tags/v${LUAJIT_RELEASE}.tar.gz"
          tar -xzf "v${LUAJIT_RELEASE}.tar.gz"
          make -C "luajit2-${LUAJIT_RELEASE}" BUILDMODE=static XCFLAGS="-DLUAJIT_USE_SYSMALLOC -DLUAJIT_DISABLE_FFI -ffat-lto-objects" TARGET_CFLAGS="-Os -flto=auto -ffunction-sections -fdata-sections" TARGET_LDFLAGS="-Wl,--gc-sections -flto=auto" -j$(nproc)
          make -C "luajit2-${LUAJIT_RELEASE}" install

      - name: Build winws2 from pinned source
        shell: C:\cygwin\bin\bash.exe -eo pipefail '{0}'
        env:
          COMMIT: ${{ steps.upstream.outputs.commit }}
          SUBDIR: ${{ steps.upstream.outputs.subdir }}
          BUILD_TARGET: ${{ steps.upstream.outputs.build_target }}
          ARTIFACT: ${{ steps.upstream.outputs.artifact }}
          LICENSE_NAME: ${{ steps.upstream.outputs.license }}
        run: |
          set -e
          make -C "upstream/$SUBDIR" "$BUILD_TARGET" CFLAGS="-DZAPRET_GH_HASH=$COMMIT"
          test -f "upstream/$SUBDIR/$ARTIFACT"
          mkdir -p dist/windows
          cp "upstream/$SUBDIR/$ARTIFACT" dist/windows/
          cp /usr/bin/cygwin1.dll dist/windows/
          {
            echo "source_commit=$COMMIT"
            echo "license=$LICENSE_NAME"
            echo "builder=github-actions/windows-latest"
            echo "windivert=2.2.2"
          } > dist/windows/PROVENANCE.txt

      - name: Fetch pinned WinDivert runtime
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/basil00/WinDivert/releases/download/v2.2.2/WinDivert-2.2.2-A.zip" -OutFile WinDivert.zip
          Expand-Archive WinDivert.zip -DestinationPath WinDivert
          Copy-Item WinDivert/WinDivert-2.2.2-A/x64/WinDivert.dll dist/windows/WinDivert.dll
          Copy-Item WinDivert/WinDivert-2.2.2-A/x64/WinDivert64.sys dist/windows/WinDivert64.sys
          Get-ChildItem dist/windows -File | Where-Object { $_.Name -ne "PROVENANCE.txt" } | ForEach-Object { $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(); "$hash  $($_.Name)" } | Set-Content -Encoding ascii dist/windows/SHA256SUMS

      - name: Upload source-built Windows engine bundle
        uses: actions/upload-artifact@v4
        with:
          name: source-built-windows-winws2
          path: dist/windows/
          if-no-files-found: error
