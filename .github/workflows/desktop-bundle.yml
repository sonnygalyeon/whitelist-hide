name: desktop-bundle

on:
  workflow_dispatch:
  push:
    branches:
      - "feature/final-release-candidate"
    paths:
      - ".github/workflows/desktop-bundle.yml"
      - "apps/desktop/**"

permissions:
  contents: read

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Generate platform icon set
        working-directory: apps/desktop
        run: npx tauri icon src-tauri/icons/icon.png

      - name: Build desktop bundles
        working-directory: apps/desktop
        run: npm run tauri:build

      - name: Upload desktop bundles
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ runner.os }}-${{ runner.arch }}
          path: apps/desktop/src-tauri/target/release/bundle/
          if-no-files-found: error
