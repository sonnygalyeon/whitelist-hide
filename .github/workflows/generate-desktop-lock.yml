name: generate-desktop-lock

on:
  workflow_dispatch:
  push:
    branches:
      - feature/release-candidate
    paths:
      - apps/desktop/src-tauri/Cargo.toml
      - .github/workflows/generate-desktop-lock.yml

permissions:
  contents: write

concurrency:
  group: generate-desktop-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/release-candidate
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate Tauri Cargo.lock
        run: cargo generate-lockfile --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Commit exact generated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps/desktop/src-tauri/Cargo.lock && git ls-files --error-unmatch apps/desktop/src-tauri/Cargo.lock >/dev/null 2>&1; then
            echo "desktop Cargo.lock is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/src-tauri/Cargo.lock
          git commit -m "build(desktop): commit generated Tauri lockfile"
          git push origin HEAD:feature/release-candidate
