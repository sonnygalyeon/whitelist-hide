name: release-readiness

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate supply-chain release gate
        run: python3 scripts/release_gate.py

  strategy-compiler:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        engine: [utunws, nfqws, winws]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Compile example strategy
        run: cargo run -p whitelist-hide-cli -- strategy compile examples/strategy.example.toml ${{ matrix.engine }}
