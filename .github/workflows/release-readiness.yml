name: release-readiness

on:
  push:
    branches:
      - feature/release-candidate
      - ver1.0
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-release:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Generate dependency lock
        run: cargo generate-lockfile
      - name: Build locked release CLI
        run: cargo build --release --locked -p whitelist-hide-cli
      - name: Test locked workspace
        run: cargo test --workspace --locked
      - name: Emit lockfile for release-candidate capture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          echo WHITELIST_HIDE_LOCK_BEGIN
          cat Cargo.lock
          echo WHITELIST_HIDE_LOCK_END

  desktop-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install
      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build
      - name: Check Tauri Rust application
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml
