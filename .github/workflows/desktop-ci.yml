name: desktop-ci

on:
  push:
    paths:
      - "apps/desktop/**"
      - "crates/core/**"
      - "crates/runtime/**"
      - "crates/orchestrator/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/core/**"
      - "crates/runtime/**"
      - "crates/orchestrator/**"
      - ".github/workflows/desktop-ci.yml"

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libwebkit2gtk-4.1-dev             libappindicator3-dev             librsvg2-dev             patchelf

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Check Tauri Rust backend
        run: cargo check --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
