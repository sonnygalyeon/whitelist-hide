name: desktop-ci

on:
  push:
    paths:
      - "apps/desktop/**"
      - "crates/core/**"
      - "crates/runtime/**"
      - "crates/controller/**"
      - "crates/helper/**"
      - "crates/watchdog/**"
      - ".github/workflows/desktop-ci.yml"
  pull_request:
    paths:
      - "apps/desktop/**"
      - "crates/core/**"
      - "crates/runtime/**"
      - "crates/controller/**"
      - "crates/helper/**"
      - "crates/watchdog/**"
      - ".github/workflows/desktop-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y             libwebkit2gtk-4.1-dev             libayatana-appindicator3-dev             librsvg2-dev             libxdo-dev             libssl-dev             patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Build native sidecars on Unix
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release -p whitelist-hide-helper -p whitelist-hide-watchdog
          triple="$(rustc --print host-tuple)"
          mkdir -p apps/desktop/src-tauri/binaries
          cp target/release/whitelist-hide-helper "apps/desktop/src-tauri/binaries/whitelist-hide-helper-$triple"
          cp target/release/whitelist-hide-watchdog "apps/desktop/src-tauri/binaries/whitelist-hide-watchdog-$triple"
          chmod 0755 "apps/desktop/src-tauri/binaries/whitelist-hide-helper-$triple"
          chmod 0755 "apps/desktop/src-tauri/binaries/whitelist-hide-watchdog-$triple"

      - name: Build native sidecars on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cargo build --release -p whitelist-hide-helper -p whitelist-hide-watchdog
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $triple = (rustc --print host-tuple).Trim()
          New-Item -ItemType Directory -Force apps/desktop/src-tauri/binaries | Out-Null
          Copy-Item target/release/whitelist-hide-helper.exe "apps/desktop/src-tauri/binaries/whitelist-hide-helper-$triple.exe"
          Copy-Item target/release/whitelist-hide-watchdog.exe "apps/desktop/src-tauri/binaries/whitelist-hide-watchdog-$triple.exe"

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm install

      - name: Generate platform icons
        working-directory: apps/desktop
        run: npm run tauri icon app-icon.svg

      - name: Build frontend
        working-directory: apps/desktop
        run: npm run build

      - name: Build Tauri bundle
        working-directory: apps/desktop
        run: npm run tauri:build
